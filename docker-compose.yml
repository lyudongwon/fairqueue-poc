# CPU layout (WSL VM = 12 vCPU, see DECISIONS.md)
#   0-1  : reserved for VM / dockerd overhead (nothing pinned)
#   2-3  : gitea            (2 cores, 2GB)
#   4-5  : gateway
#   6    : human simulator
#   7-10 : crawler
#   11   : tools (seeding, cost measurement, docker stats)
name: fairqueue

services:
  gitea:
    image: gitea/gitea:1.27.3
    cpuset: "2-3"
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DOMAIN: gitea
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - gitea-data:/data
    ports:
      - "127.0.0.1:3000:3000"

  gateway:
    build: ./gateway
    cpuset: "4-5"
    environment:
      MODE: ${MODE:-none}
      RATE_PER_IP: ${RATE_PER_IP:-2}
      BURST_PER_IP: ${BURST_PER_IP:-2}
      GLOBAL_N: ${GLOBAL_N:-4}
      ANON_N: ${ANON_N:-2}
      COOKIE_M: ${COOKIE_M:-4}
      UPSTREAM: http://gitea:3000
      LOG_PATH: /app/${RUN_DIR:-results/scratch}/raw/gateway.jsonl
    volumes:
      - ./results:/app/results
    depends_on: [gitea]

  human:
    build: ./loadgen
    cpuset: "6"
    working_dir: /app
    command: python loadgen/human.py
    environment:
      TARGET: http://gateway:8080
      POOL: /app/urlpool
      RUN_DIR: /app/${RUN_DIR:-results/scratch}
      RATE: ${RATE:-3}
      WARMUP: ${WARMUP:-30}
      DURATION: ${DURATION:-180}
      SEED: ${SEED:-1}
    volumes:
      - ./:/app
    profiles: ["run"]

  crawler:
    build: ./loadgen
    cpuset: "7-10"
    working_dir: /app
    command: python loadgen/crawler.py
    environment:
      TARGET: http://gateway:8080
      POOL: /app/urlpool
      RUN_DIR: /app/${RUN_DIR:-results/scratch}
      CRAWLER: ${CRAWLER:-rotating}
      C: ${C:-10}
      WARMUP: ${WARMUP:-30}
      DURATION: ${DURATION:-180}
      SEED: ${SEED:-1}
    volumes:
      - ./:/app
    profiles: ["run"]

  monitor:
    build: ./loadgen
    cpuset: "11"
    working_dir: /app
    command: python scripts/monitor.py
    stop_signal: SIGTERM
    environment:
      RUN_DIR: /app/${RUN_DIR:-results/scratch}
      TARGETS: ${TARGETS:-}
    volumes:
      - ./:/app
      - /sys/fs/cgroup:/host_cgroup:ro
    profiles: ["run"]

  tools:
    build: ./loadgen
    cpuset: "11"
    working_dir: /app
    volumes:
      - ./:/app
      - work:/work
    environment:
      GITEA_URL: http://gitea:3000
    depends_on: [gitea]
    profiles: ["tools"]

  analysis:
    build: ./analysis
    cpuset: "11"
    working_dir: /app
    volumes:
      - ./:/app
    profiles: ["tools"]

volumes:
  gitea-data:
  work:
